[project]
name = "polarcodes"
version = "0.1.0"
description = "Pedagogical replication of Tal & Vardy (2012) List Decoding of Polar Codes: polar -> SC -> SCL -> CA-SCL"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "tqdm>=4.66"]

[tool.hatch.build]
artifacts = []
force-include = { "src/polar" = "polar" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polar"]
